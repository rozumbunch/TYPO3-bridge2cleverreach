<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:variable name="headerPosition" value="{data.header_position}"/>
<f:variable name="positionClass" value=""/>
<f:if condition="{headerPosition}">
    <f:variable name="positionClass" value="{headerPosition}"/>
</f:if>

<div class="newsletter-header {positionClass}">
    <f:if condition="{data.header}">
        <f:variable name="headerLayout" value="{data.header_layout}"/>
        <f:switch expression="{headerLayout}">
            <f:case value="1"><h1>{data.header}</h1></f:case>
            <f:case value="2"><h2>{data.header}</h2></f:case>
            <f:case value="3"><h3>{data.header}</h3></f:case>
            <f:case value="4"><h4>{data.header}</h4></f:case>
            <f:case value="5"><h5>{data.header}</h5></f:case>
            <f:case value="6"><h6>{data.header}</h6></f:case>
            <f:case value="100"><f:comment>-- do not show header --</f:comment></f:case>
            <f:defaultCase>
                <h2>{data.header}</h2>
            </f:defaultCase>
        </f:switch>
    </f:if>
    <f:if condition="{data.subheader}">
        <p>{data.subheader}</p>
    </f:if>
</div>

</html>
