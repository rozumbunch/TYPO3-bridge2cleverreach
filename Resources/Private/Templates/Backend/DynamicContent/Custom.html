<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">
<f:layout name="Module"/>

<f:section name="Content">
    <div style="padding: 20px;">
        <form method="post" enctype="multipart/form-data"  id="BackendCleverReachDynamicContentController">
            <h1>Custom contents</h1>

            <div class="typo3-TCEforms">
                <div role="tabpanel">
                    <fieldset class="form-section js-multiselect-widget">
                        <div class="form-group t3js-formengine-validation-marker t3js-formengine-palette-field">
                            <div class="formengine-field-item t3js-formengine-field-item">
                                <div class="form-wizards-wrap">
                                    <div class="form-wizards-element" >
                                        <div class="form-multigroup-wrap t3js-formengine-field-group">
                                            <div class="form-multigroup-item form-multigroup-element">
                                                <label>Selected custom contents</label>
                                                <div class="form-wizards-wrap form-wizards-aside" >
                                                    <div class="form-wizards-element" style="
                                                                display: flex;
                                                                column-gap: 6px;
                                                            ">
                                                        <select id="selectedItems"  multiple size="8" class="form-select form-control js-selected">
                                                            <f:for each="{selectedContents}" as="selectedDynamicContent">
                                                                <option value="{selectedDynamicContent}" selected>{selectedDynamicContent}</option>
                                                            </f:for>
                                                        </select>
                                                        <div class="form-wizards-items-aside form-wizards-items-aside--move">
                                                            <div class="btn-group-vertical">
                                                                <button type="button" class="btn btn-default mb-2 js-remove" title="Entfernen"><core:icon identifier="actions-move-right"></core:icon></button>
                                                                <button type="button" class="btn btn-default mb-2 js-add" title="Hinzufügen"><core:icon identifier="actions-move-left"></core:icon></button>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="form-multigroup-item form-multigroup-element">
                                                <label>Available custom contents</label>
                                                <div class="form-wizards-wrap form-wizards-aside">
                                                    <div class="form-wizards-element">
                                                        <input type="search" class="form-control form-control-sm mb-2 js-available-search" placeholder="Suchen…" autocomplete="off">
                                                        <select id="availableItems" multiple size="8" class="form-select form-control js-available">

                                                            <f:for each="{contents}" as="DynamicContent">
                                                                <f:if condition="!{selectedContents.{DynamicContent.type}}">
                                                                    <option value="{DynamicContent.type}">{DynamicContent.type}</option>
                                                                </f:if>
                                                            </f:for>
                                                        </select>
                                                    </div>
                                                </div>
                                            </div>
                                            <input type="hidden" name="selectedContents" class="js-hidden" id="multiSelectHidden" value="{selectedContentsString}"/>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>


                    </fieldset>
                </div>
            </div>
        </form>
    </div>

</f:section>
</html>
